server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: none
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: linke-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
app:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173}
  secure-cookies: ${SECURE_COOKIES:true}
  mail-enabled: ${MAIL_ENABLED:false}
  mail-from: ${MAIL_FROM:noreply@example.invalid}
  # Empty means no categories are open. Synthetic categories are opt-in, never implied.
  teacher-categories: ${TEACHER_CATEGORIES:}
