<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>邻课 · 页面与交互评审</title>
<style>
:root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#263e32;background:#eef0ea;--green:#294e3d;--muted:#657366;--border:#dce1d8}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #8da77e;outline-offset:3px}button:disabled{cursor:default;opacity:.55}.review-header{position:sticky;top:0;z-index:4;background:#213e32;color:white;padding:16px 24px;display:flex;gap:18px;align-items:center;justify-content:space-between}.review-header h1{font-size:18px;margin:0}.review-header p{font-size:12px;color:#d9e3d3;margin:5px 0 0}.review-header a{color:white;font-size:13px}.layout{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100vh - 80px)}.sidebar{padding:20px 12px;background:#fff;border-right:1px solid var(--border)}.sidebar h2{font-size:12px;color:var(--muted);margin:18px 12px 8px}.nav{display:block;text-align:left;width:100%;padding:11px 12px;margin:2px 0;border:0;border-radius:8px;background:transparent;font-size:12px;color:#4e5c50}.nav.active{background:#e6eee1;color:var(--green);font-weight:600}.workspace{padding:24px;min-width:0}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}.toolbar button{border:1px solid var(--border);background:white;border-radius:8px;padding:9px 14px;font-size:12px}.meta{margin-left:auto;color:var(--muted);font-size:12px}.stage{display:flex;align-items:flex-start;justify-content:center;min-height:860px;overflow:auto;padding:6px 10px 30px}.phone{width:390px;height:844px;flex-shrink:0;border-radius:20px;box-shadow:0 8px 30px #243e3214;overflow:hidden;background:#f7f8f5;display:flex;flex-direction:column}.app-header{height:60px;flex-shrink:0;background:white;display:flex;align-items:center;justify-content:space-between;padding:16px 20px}.app-header b{font-size:14px;color:var(--green)}.app-header span{font-size:12px;color:var(--muted)}.app-content{padding:22px 20px;overflow:auto;flex:1}.app-content h2{font-size:24px;line-height:1.4;margin:0 0 6px}.subtitle{font-size:12px;color:var(--muted);line-height:1.7;margin:0 0 20px}.block{margin-bottom:16px}.field-label{display:block;font-size:14px;margin-bottom:8px}.field-value{width:100%;border:1px solid #d9ddd5;background:white;padding:12px 14px;border-radius:8px;min-height:44px;line-height:1.55;font-size:14px;white-space:pre-line}.field-value.error{border-color:#a23434}.field-error{color:#a23434;font-size:12px;margin:6px 0 0}.card{background:white;border:1px solid var(--border);border-radius:12px;padding:16px}.card h3{font-size:14px;line-height:1.6;margin:0 0 8px}.card p,.banner p{font-size:14px;line-height:1.65;white-space:pre-line;margin:8px 0 0}.card .card-meta{font-size:12px;color:var(--muted)}.tag{display:inline-block;padding:5px 9px;font-size:12px;line-height:1.4;background:#e6eee1;border-radius:7px;margin:0 0 8px}.tag.danger{background:#fceceb;color:#a23434}.banner{padding:16px;border-radius:12px;background:#fbf0df;color:#825b28}.banner.danger{background:#fceceb;color:#a23434}.banner strong{font-size:14px}.banner p{font-size:12px}.copy{font-size:14px;line-height:1.7;white-space:pre-line}.copy.caption{font-size:12px}.copy.muted{color:var(--muted)}.action{width:100%;padding:12px 16px;min-height:44px;border:1px solid var(--green);background:var(--green);color:white;border-radius:8px;font-size:14px;text-align:center}.action.secondary{background:white;color:var(--green);border-color:#cbd5c5}.card .action{margin-top:14px}.app-footer{padding:16px;background:white;flex-shrink:0}.app-footer p{font-size:12px;line-height:1.6;color:var(--muted);margin:8px 0 0}.desktop{width:1280px;min-height:900px;flex-shrink:0;display:grid;grid-template-columns:200px 1fr;background:#f7f8f5;box-shadow:0 8px 30px #243e3214}.desktop .app-side{padding:28px 24px;background:var(--green);color:white}.app-side h2{margin:0;font-size:24px}.app-side p{font-size:12px;margin:10px 0 32px}.app-side div{font-size:14px;padding:16px 0}.desktop .app-content{padding:32px}.desktop .app-content>.block:has(>.action){max-width:360px}.notes{max-width:1000px;margin:16px auto;font-size:13px;line-height:1.8;color:#536553;background:#ffffffb8;padding:16px 20px;border-radius:12px}.notes b{color:#294e3d}.notes code{font-family:ui-monospace,monospace;background:#e9eee5;border-radius:4px;padding:2px 5px}.link-hint{font-size:11px;color:#778473;margin-top:8px}.intro{max-width:1000px;margin:10px auto 30px;padding:32px;background:white;border-radius:16px}.intro h2{font-size:30px;margin:0 0 16px}.intro p{line-height:1.8;color:#657366}.role-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.role-grid>div{background:#f7f8f5;padding:20px;border-radius:12px}.role-grid h3{margin:0 0 12px}.role-grid ul{padding-left:20px;color:#657366;font-size:13px;line-height:2}.legend{display:flex;gap:12px;flex-wrap:wrap}.legend button{background:white;border:1px solid #b7c5b0;border-radius:8px;padding:10px;color:#294e3d}.stage.overview{display:block;min-height:0}.app-header button{border:0;background:transparent;color:#294e3d;min-width:44px;min-height:44px;text-align:left;padding:0}.screen-info{max-width:900px;margin:0 auto 16px;font-size:12px;color:#657366}.screen-info strong{color:#294e3d}@media(max-width:760px){.layout{grid-template-columns:1fr}.sidebar{max-height:190px;overflow:auto;border-bottom:1px solid var(--border)}.sidebar h2{display:none}.nav{display:inline-block;width:auto}.workspace{padding:14px 4px}.review-header{padding:14px}.review-header a{display:none}.stage{justify-content:flex-start;padding-left:max(4px,calc((100vw - 410px)/2))}.meta{margin:0}.role-grid{grid-template-columns:1fr}.intro{padding:24px}.toolbar{padding:0 10px}.notes{margin:12px}.screen-info{padding:0 12px}}
.stage:has(.desktop){justify-content:flex-start}.desktop-back{padding:24px 32px 0;max-width:424px}

/* Demo usability: keep long scene navigation independent from the page canvas. */
@media(min-width:761px){body{height:100dvh;overflow:hidden}.layout{height:calc(100dvh - 80px);min-height:0}.sidebar{min-height:0;overflow-y:auto;overscroll-behavior:contain}.workspace{min-height:0;overflow:auto;overscroll-behavior:contain}.stage{min-height:0}.phone{height:min(844px,calc(100dvh - 215px));min-height:560px}}
</style>
<header class="review-header"><div><h1>邻课 · 页面与交互规格</h1><p>2026.11.07 / 首版核心路径：老师资料、发布审核、回应互选与定向授权 / 只读合成样例</p></div><a href="https://www.figma.com/design/mIWvLoDcD6W0MlDny0ZwqB" target="_blank" rel="noreferrer">打开可编辑 Figma 设计 ↗</a></header>
<div class="layout"><aside class="sidebar" id="sidebar" aria-label="评审页面导航"></aside><main class="workspace"><div class="toolbar"><button id="home">设计索引</button><button id="back">返回上一画面</button><span class="meta" id="meta"></span></div><div class="screen-info" id="info"></div><div class="stage" id="stage"></div><div class="notes"><b>评审边界：</b>此预览用于检查信息结构、固定样例导航和提示文案，字段为只读样例。它不提交数据，不执行登录、授权、业务校验、并发或跨账号同步。尚未明确的规则保留待评审标记。<br>关键区分：保存草稿 ≠ 提交审核；投递 ≠ 双方互选；互选 ≠ 双方已授权联系方式。实际产品采用账号密码登录、每个账号仅一种业务身份；这里的多角色入口只用于评审。详细规则见首版主规格。</div></main></div>
<script>
const scenes=/*__SCENES__*/[];
const byId=Object.fromEntries(scenes.map(s=>[s.id,s]));let current='overview';const history=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const navigation=/*__NAVIGATION__*/{};
const backTargets=navigation.backTargets;
const groups=[['账号 · 登录与单一身份',s=>s.id.startsWith('G-0')],['需求方 · 需求与本人资料',s=>s.id.startsWith('P-')],['老师 · 资料、需求与意向',s=>s.id.startsWith('T-')],['回应与互选',s=>s.id.startsWith('S-01')],['联系方式 · 本人授权与撤回',s=>s.id.startsWith('S-03')],['运营 · 需求审核',s=>s.kind==='desktop'],['必要失败与空状态',s=>s.id.startsWith('X-')]];
function action(label,to,secondary=false,back=false){const linked=to&&byId[to]&&to!==current;return `<button class="action ${secondary?'secondary':''}" ${back?'data-back="true"':linked?`data-go="${esc(to)}"`:'disabled'}>${esc(label)}</button>`;}
function block(b){if(b.type==='field'){let control;if(['multiselect','checkbox'].includes(b.control))control=`<div class="field-value">${(b.options||[]).map(o=>`<label style="display:flex;gap:8px;align-items:center;padding:5px 0"><input type="checkbox" disabled ${(b.selected||[]).includes(o)?'checked':''}>${esc(o)}</label>`).join('')}</div>`;else if(b.control==='select')control=`<select class="field-value" disabled aria-label="${esc(b.label)}">${(b.options||[b.value]).map(o=>`<option ${o===b.value?'selected':''}>${esc(o)}</option>`).join('')}</select>`;else if(b.control==='textarea'||b.multiline)control=`<textarea class="field-value" readonly rows="4" aria-label="${esc(b.label)}">${esc(b.value)}</textarea>`;else control=`<input class="field-value ${b.error?'error':''}" type="${['number','tel','date','time','password','email'].includes(b.control)?b.control:'text'}" readonly value="${esc(b.value)}" aria-label="${esc(b.label)}">`;return `<div class="block"><span class="field-label">${esc(b.label)}</span>${control}${b.hint?`<p class="copy caption muted">${esc(b.hint)}</p>`:''}${b.error?`<p class="field-error">${esc(b.error)}</p>`:''}</div>`;}
if(b.type==='tag')return `<div class="block"><span class="tag ${b.tone==='Danger'?'danger':''}">${esc(b.label)}</span></div>`;
if(b.type==='text')return `<p class="block copy ${esc(b.role||'')} ${esc(b.tone||'')}">${esc(b.text)}</p>`;
if(b.type==='button')return `<div class="block">${action(b.label,b.to,b.secondary,b.back)}</div>`;
if(b.type==='banner')return `<div class="block banner ${b.danger?'danger':''}"><strong>${esc(b.title)}</strong><p>${esc(b.body)}</p></div>`;
return `<article class="block card">${b.status?`<span class="tag ${b.tone==='Danger'?'danger':''}">${esc(b.status)}</span>`:''}<h3>${esc(b.title)}</h3>${b.meta?`<p class="card-meta">${esc(b.meta)}</p>`:''}${b.body?`<p>${esc(b.body)}</p>`:''}${b.action?action(b.action,b.to,true):''}</article>`;}
function go(id,push=true){if(id!=='overview'&&!byId[id])return;if(push&&id!==current)history.push(current);current=id;location.hash=id;render();}
function render(){document.querySelector('.workspace').scrollTop=0;document.getElementById('back').disabled=!history.length;document.querySelectorAll('[data-nav]').forEach(n=>n.classList.toggle('active',n.dataset.nav===current));const stage=document.getElementById('stage');stage.classList.toggle('overview',current==='overview');document.getElementById('meta').textContent=current==='overview'?`${scenes.length} 个画面 / 固定样例导航`:`${current} / ${byId[current].kind==='desktop'?'桌面审核':'移动端'}`;
if(current==='overview'){document.getElementById('info').textContent='';stage.innerHTML=`<section class="intro"><h2>先了解，再连接。</h2><p>首版先完成发布、审核、公开浏览，再推进投递/邀请、互选和联系方式授权。预约、服务结果、合作和评价保留为后续规划。每个角色从自己的入口开始。</p><div class="role-grid"><div><h3>需求方</h3><ul><li>草稿与提交前预览</li><li>待审核及驳回后修订</li><li>查看候选、表达本人意向</li></ul>${action('从我的需求开始','P-03a')}</div><div><h3>运营</h3><ul><li>查看当前提交版本</li><li>通过或填写驳回原因</li><li>冲突后重新加载核对</li></ul>${action('从审核队列开始','A-01')}</div><div><h3>老师</h3><ul><li>完善资料并主动公开</li><li>浏览有效公开需求</li><li>投递后等待需求方回应</li><li>本人接受或婉拒邀请</li></ul>${action('从老师资料开始','T-04')}</div></div><p>待审版本不公开；单方意向不等于双方确认；角色间的业务同步在正式系统中由服务端完成。</p><div class="legend"><button data-go="G-01">账号登录与注册</button><button data-go="G-02-select">单一身份选择</button><button data-go="S-03">本人联系方式授权</button><button data-go="S-03-teacher">老师授权视角</button><button data-go="X-validation">字段校验</button><button data-go="X-timeout">提交超时</button><button data-go="X-conflict">版本冲突</button><button data-go="P-06-rejected">驳回修订</button><button data-go="S-01-response">需求方回应投递</button><button data-go="P-01">需求方邀请老师</button><button data-go="S-01-invited">老师回应邀请</button></div></section>`;return;}
const s=byId[current];document.getElementById('info').innerHTML=`<strong>${esc(s.phase==='later'?'后续规划（不纳入首版）':s.detail==='wireframe'?'首版结构稿（待深化）':'首版核心流程 / 状态详细稿')}</strong> · ${esc(s.id)} · ${esc(s.role||'运营')} · 只读合成样例`;
const content=`<section class="app-content"><h2>${esc(s.title)}</h2><p class="subtitle">${esc(s.subtitle)}</p>${s.blocks.map(block).join('')}</section>`;
if(s.kind==='desktop')stage.innerHTML=`<div class="desktop"><aside class="app-side"><h2>邻课</h2><p>运营 · 需求审核</p><div>需求审核</div></aside><div>${backTargets[s.id]?`<div class="desktop-back"><button class="action secondary" data-go="${esc(backTargets[s.id])}">返回审核队列</button></div>`:''}${content}</div></div>`;
else stage.innerHTML=`<div class="phone"><div class="app-header">${backTargets[s.id]?`<button data-go="${esc(backTargets[s.id])}">返回</button>`:'<b>邻课</b>'}<span>${esc(s.role)} · 坪山</span></div>${content}<footer class="app-footer">${s.action?action(s.action,s.to,s.secondary):''}${s.footer?`<p>${esc(s.footer)}</p>`:''}</footer></div>`;
stage.scrollTop=0;stage.scrollLeft=0;}
document.getElementById('sidebar').innerHTML='<button class="nav" data-nav="overview" data-go="overview">设计索引</button>'+groups.map(([name,filter])=>`<h2>${esc(name)}</h2>${scenes.filter(s=>s.phase!=='later'&&filter(s)).map(s=>`<button class="nav" data-nav="${esc(s.id)}" data-go="${esc(s.id)}">${esc(s.id)} · ${esc(s.title)}</button>`).join('')}`).join('')+'<details><summary style="padding:16px 12px;font-size:12px">延期历史样例（不在首版主路径）</summary>'+scenes.filter(s=>s.phase==='later').map(s=>`<button class="nav" data-nav="${esc(s.id)}" data-go="${esc(s.id)}">延期 · ${esc(s.id)} · ${esc(s.title)}</button>`).join('')+'</details>';
function back(){const last=history.pop();if(last)go(last,false);}document.addEventListener('click',e=>{if(e.target.closest('[data-back]')){back();return;}const n=e.target.closest('[data-go]');if(n)go(n.dataset.go);});document.getElementById('home').onclick=()=>go('overview');document.getElementById('back').onclick=back;window.addEventListener('hashchange',()=>{const id=decodeURIComponent(location.hash.slice(1))||'overview';if(id!==current&&(id==='overview'||byId[id])){const at=history.lastIndexOf(id);if(at>=0)history.splice(at);else history.push(current);current=id;render();}});const initial=decodeURIComponent(location.hash.slice(1));if(initial==='overview'||byId[initial])current=initial;render();
</script>
</html>
